# Configuracion para desplegar en Render (https://render.com).
# Render lee este archivo y crea el servicio con estos ajustes.
services:
  - type: web
    name: chatbot-ventas
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # La API key NO va aqui (es secreta). Se pone en el panel de Render.
      - key: GROQ_API_KEY
        sync: false
